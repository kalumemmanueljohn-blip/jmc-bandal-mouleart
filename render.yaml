services:
  - type: web
    name: jeunesse-eglise
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python -c "
from django.contrib.auth.models import User;
# Récupérer l'utilisateur admin
user = User.objects.filter(username='admin').first();
if user:
    # Forcer les droits
    user.is_staff = True;
    user.is_superuser = True;
    user.is_active = True;
    user.save();
    print('='*50);
    print('✅ ADMIN MIS À JOUR');
    print('='*50);
    print('Nom: admin');
    print('Mot de passe: Admin123!');
    print('is_superuser:', user.is_superuser);
    print('is_staff:', user.is_staff);
else:
    # Créer un nouveau superuser
    User.objects.create_superuser('admin', 'admin@exemple.com', 'Admin123!');
    print('='*50);
    print('✅ ADMIN CRÉÉ');
    print('='*50);
print('='*50);
"
    startCommand: gunicorn jeunesse_eglise.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
