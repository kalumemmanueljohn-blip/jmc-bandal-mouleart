services:
  - type: web
    name: jeunesse-eglise
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python -c "
from django.contrib.auth.models import User;
user, created = User.objects.get_or_create(
    username='admin',
    defaults={
        'email': 'admin@exemple.com',
        'is_staff': True,
        'is_superuser': True,
        'is_active': True
    }
);
if not created:
    user.is_staff = True;
    user.is_superuser = True;
    user.is_active = True;
user.set_password('Admin123!');
user.save();
print('='*50);
print('✅ ADMINISTRATEUR PRÊT');
print('='*50);
print('Nom: admin');
print('Mot de passe: Admin123!');
print('is_superuser:', user.is_superuser);
print('='*50);
"
    startCommand: gunicorn jeunesse_eglise.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"